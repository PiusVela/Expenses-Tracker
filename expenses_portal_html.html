<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGX Expenses Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --secondary: #7209b7;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c7280;
      --border: #dee2e6;
      --online: #10b981;
      --offline: #ef4444;
      --edit: #3b82f6;
      --delete: #ef4444;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--dark);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 30px 40px 20px 40px;
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.online {
      background: var(--online);
      box-shadow: 0 0 10px var(--online);
    }

    .status-dot.offline {
      background: var(--offline);
      box-shadow: 0 0 10px var(--offline);
    }

    .status-dot.connecting {
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
      animation: blink 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      border-left: 6px solid var(--primary);
      transition: transform 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .stat-label {
      color: var(--gray);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--dark);
      font-family: 'Courier New', monospace;
      margin: 5px 0;
    }

    .form-section {
      background: var(--light);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 40px;
      border: 2px solid var(--border);
    }

    .form-title {
      color: var(--primary-dark);
      margin-bottom: 25px;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.95rem;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      background: white;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
      transform: translateY(-2px);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3);
    }

    .btn-secondary {
      background: var(--light);
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }

    .btn-edit {
      background: var(--edit);
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-edit:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .btn-delete {
      background: var(--delete);
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-delete:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .btn-save {
      background: var(--success);
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-save:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    .btn-cancel {
      background: var(--gray);
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-cancel:hover {
      background: #4b5563;
      transform: translateY(-2px);
    }

    .btn-primary:disabled, .btn-edit:disabled, .btn-delete:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-left: 10px;
    }

    .message {
      padding: 15px 20px;
      border-radius: 10px;
      margin: 20px 0;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.show {
      display: flex;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border-left: 4px solid #17a2b8;
    }

    .expenses-list {
      margin-top: 40px;
    }

    .expenses-list h3 {
      color: var(--primary-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s;
      border-radius: 8px;
      margin-bottom: 5px;
      background: white;
    }

    .expense-item.editing {
      background: #f0f9ff;
      border: 2px solid var(--edit);
      transform: scale(1.01);
    }

    .expense-item:hover {
      background: var(--light);
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .expense-details {
      flex: 1;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
    }

    .category-yaka { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .category-water { background: #e0f2f1; color: #00796b; border: 1px solid #b2dfdb; }
    .category-groceries { background: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
    .category-food { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
    .category-fuel { background: #fff8e1; color: #ff8f00; border: 1px solid #ffecb3; }
    .category-transport { background: #e8f5e8; color: #2e7d32; border: 1px solid #c8e6c9; }
    .category-internet { background: #fce4ec; color: #c2185b; border: 1px solid #f8bbd9; }
    .category-airtime { background: #fff3e0; color: #f57c00; border: 1px solid #ffe0b2; }
    .category-rent { background: #e8eaf6; color: #283593; border: 1px solid #c5cae9; }
    .category-laundry { background: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
    .category-clothing { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
    .category-school-fees { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .category-medical { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .category-savings { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .category-debt { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    .category-giving { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
    .category-entertainment { background: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
    .category-general { background: #f5f5f5; color: #424242; border: 1px solid #e0e0e0; }

    .expense-amount {
      font-weight: 700;
      font-size: 1.2rem;
      font-family: 'Courier New', monospace;
      margin-left: 20px;
      min-width: 120px;
      text-align: right;
    }

    .edit-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .edit-form input, .edit-form select {
      padding: 10px;
      font-size: 14px;
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--gray);
      font-style: italic;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--gray);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: 15px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal h3 {
      color: var(--primary-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }
      
      .header {
        padding: 20px;
      }
      
      .header h1 {
        font-size: 1.8rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      
      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      
      .status-indicator {
        align-self: flex-start;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .expense-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      
      .action-buttons {
        margin-left: 0;
        margin-top: 10px;
        width: 100%;
        justify-content: flex-end;
      }
      
      .expense-amount {
        text-align: left;
        margin-left: 0;
      }
      
      .edit-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase COMPATIBILITY version -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <h1>
          <i class="fas fa-wallet"></i> 
          <span>UGX Expenses Tracker</span>
        </h1>
        <div class="status-indicator" id="statusIndicator">
          <div class="status-dot connecting" id="statusDot"></div>
          <span id="statusText">Initializing...</span>
        </div>
      </div>
      <p>Track and edit your daily expenses in Ugandan Shillings</p>
    </div>

    <div class="content">
      <!-- Status Message -->
      <div id="statusMessage" class="message"></div>

      <!-- Quick Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-calendar-day"></i> Today</div>
          <div class="stat-value" id="todayTotal">UGX 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-calendar-week"></i> This Week</div>
          <div class="stat-value" id="weekTotal">UGX 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-calendar-alt"></i> This Month</div>
          <div class="stat-value" id="monthTotal">UGX 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-calendar"></i> This Year</div>
          <div class="stat-value" id="yearTotal">UGX 0</div>
        </div>
      </div>

      <!-- Add Expense Form -->
      <div class="form-section">
        <h3 class="form-title"><i class="fas fa-plus-circle"></i> Add New Expense</h3>
        <div class="form-grid">
          <div class="form-group">
            <label><i class="fas fa-money-bill-wave"></i> Amount (UGX)</label>
            <input type="number" id="amount" placeholder="e.g. 50000" min="0" step="100" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-tags"></i> Category</label>
            <select id="category" required>
              <option value="Yaka">⚡ Yaka (Electricity)</option>
              <option value="Water">💧 Water Bill</option>
              <option value="Groceries" selected>🛒 Groceries</option>
              <option value="Food">🍲 Food & Dining</option>
              <option value="Fuel">⛽ Fuel</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Internet">🌐 Internet</option>
              <option value="Airtime">📱 Airtime</option>
              <option value="Rent">🏠 Rent</option>
              <option value="Laundry">👕 Laundry</option>
              <option value="Clothing">👔 Clothing</option>
              <option value="School Fees">📚 School Fees</option>
              <option value="Medical">🏥 Medical</option>
              <option value="Savings">💰 Savings</option>
              <option value="Debt">💳 Debt Payment</option>
              <option value="Giving">🤲 Giving</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="General">📦 General</option>
            </select>
          </div>
          <div class="form-group">
            <label><i class="fas fa-calendar"></i> Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-sticky-note"></i> Description (Optional)</label>
            <input type="text" id="description" placeholder="What was this expense for?">
          </div>
        </div>
        <button class="btn btn-primary" id="addBtn" disabled>
          <i class="fas fa-plus"></i> Add Expense
        </button>
      </div>

      <!-- Recent Expenses -->
      <div class="expenses-list">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3><i class="fas fa-receipt"></i> Recent Expenses</h3>
          <button class="btn btn-secondary" id="refreshBtn" style="display: none;">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
        <div id="expensesList">
          <div class="loading">
            <div class="spinner"></div>
            <p>Loading expenses...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h3>
      <p>Are you sure you want to delete this expense?</p>
      <p id="deleteExpenseDetails" style="font-weight: 600; margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 8px;"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDelete">
          <i class="fas fa-times"></i> Cancel
        </button>
        <button class="btn btn-delete" id="confirmDelete">
          <i class="fas fa-trash"></i> Delete Expense
        </button>
      </div>
    </div>
  </div>

  <script>
    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCNPXQvIPRVsJ5QTT5uBqAl9Jq8VuSW_yc",
      authDomain: "expense-tracker-1f7e2.firebaseapp.com",
      projectId: "expense-tracker-1f7e2",
      storageBucket: "expense-tracker-1f7e2.firebasestorage.app",
      messagingSenderId: "102435814972",
      appId: "1:102435814972:web:82dbaf733a411e549bcd39"
    };

    // Global variables
    let db = null;
    let isFirestoreReady = false;
    let expenseToDelete = null;
    let currentlyEditing = null;

    // Check if Firebase is loaded
    function isFirebaseLoaded() {
      return typeof firebase !== 'undefined' && typeof firebase.initializeApp !== 'undefined';
    }

    // Update status indicator
    function updateStatus(status, message) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (dot && text) {
        dot.className = 'status-dot ' + status;
        text.textContent = message;
      }
    }

    // Show message
    function showMessage(message, type = 'info') {
      const messageDiv = document.getElementById('statusMessage');
      const icon = type === 'success' ? 'fa-check-circle' : 
                   type === 'error' ? 'fa-exclamation-circle' : 
                   'fa-info-circle';
      
      messageDiv.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${message}</span>
      `;
      messageDiv.className = `message ${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {
          messageDiv.className = 'message';
        }, 5000);
      }
    }

    // Format currency
    function formatCurrency(amount) {
      return 'UGX ' + parseInt(amount).toLocaleString('en-UG');
    }

    // Get month key
    function getMonthKey(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
    }

    // Get week key
    function getWeekKey(dateStr) {
      const d = new Date(dateStr);
      const startOfYear = new Date(d.getFullYear(), 0, 1);
      const days = Math.floor((d - startOfYear) / (24 * 60 * 60 * 1000));
      return `${d.getFullYear()}-W${Math.ceil((days + 1) / 7)}`;
    }

    // Get day key
    function getDayKey(dateStr) {
      return dateStr;
    }

    // Get year key
    function getYearKey(dateStr) {
      return new Date(dateStr).getFullYear().toString();
    }

    // Initialize Firebase
    function initializeFirebase() {
      updateStatus('connecting', 'Checking Firebase...');
      
      if (!isFirebaseLoaded()) {
        updateStatus('offline', 'Firebase not loaded');
        showMessage('❌ Firebase SDK failed to load. Please check internet connection and refresh.', 'error');
        return;
      }
      
      try {
        let app;
        if (firebase.apps.length === 0) {
          app = firebase.initializeApp(firebaseConfig);
          console.log('Firebase initialized successfully');
        } else {
          app = firebase.app();
          console.log('Using existing Firebase app');
        }
        
        db = firebase.firestore();
        console.log('Firestore instance obtained');
        
        testConnection();
        
      } catch (error) {
        console.error('Firebase initialization error:', error);
        updateStatus('offline', 'Initialization failed');
        showMessage('❌ Firebase error: ' + error.message, 'error');
      }
    }

    // Test Firestore connection
    async function testConnection() {
      updateStatus('connecting', 'Testing connection...');
      
      if (!db) {
        updateStatus('offline', 'No database instance');
        return;
      }
      
      try {
        const testRef = db.collection('expenses');
        const testSnapshot = await testRef.limit(1).get();
        
        isFirestoreReady = true;
        updateStatus('online', 'Connected ✓');
        showMessage('✅ Successfully connected to Firebase Firestore!', 'success');
        
        setupApp();
        loadInitialData();
        
      } catch (error) {
        console.error('Connection test failed:', error);
        updateStatus('offline', 'Connection failed');
        showMessage('❌ Could not connect: ' + error.message, 'error');
      }
    }

    // Setup the app after successful connection
    function setupApp() {
      const addBtn = document.getElementById('addBtn');
      addBtn.disabled = false;
      addBtn.innerHTML = '<i class="fas fa-plus"></i> Add Expense';
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
      
      addBtn.addEventListener('click', addExpense);
      document.getElementById('description').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addExpense();
      });
      
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.style.display = 'block';
      refreshBtn.addEventListener('click', loadInitialData);
      
      // Setup modal handlers
      document.getElementById('cancelDelete').addEventListener('click', () => {
        document.getElementById('deleteModal').style.display = 'none';
      });
      
      document.getElementById('confirmDelete').addEventListener('click', deleteExpense);
    }

    // Add expense
    async function addExpense() {
      if (!isFirestoreReady) {
        showMessage('⚠️ Please connect to Firebase first', 'error');
        return;
      }

      const amount = document.getElementById('amount').value.trim();
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value.trim();

      if (!amount || !date) {
        showMessage('❌ Amount and date are required', 'error');
        return;
      }

      if (parseFloat(amount) <= 0 || isNaN(parseFloat(amount))) {
        showMessage('❌ Please enter a valid amount', 'error');
        return;
      }

      const addBtn = document.getElementById('addBtn');
      const originalText = addBtn.innerHTML;
      
      try {
        addBtn.disabled = true;
        addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

        const expenseData = {
          amount: parseFloat(amount),
          category: category,
          date: date,
          description: description || '',
          monthKey: getMonthKey(date),
          weekKey: getWeekKey(date),
          dayKey: getDayKey(date),
          yearKey: getYearKey(date),
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          createdAt: new Date().toISOString()
        };

        await db.collection('expenses').add(expenseData);

        document.getElementById('amount').value = '';
        document.getElementById('description').value = '';

        showMessage(`✅ Added ${formatCurrency(amount)} for ${category}`, 'success');

        loadInitialData();

      } catch (error) {
        console.error('Error adding expense:', error);
        showMessage('❌ Error: ' + error.message, 'error');
      } finally {
        addBtn.disabled = false;
        addBtn.innerHTML = originalText;
      }
    }

    // Start editing an expense
    function startEditExpense(docId, expense) {
      if (currentlyEditing === docId) return;
      
      // Cancel any ongoing edit
      if (currentlyEditing) {
        cancelEditExpense(currentlyEditing);
      }
      
      currentlyEditing = docId;
      const expenseItem = document.getElementById(`expense-${docId}`);
      if (!expenseItem) return;
      
      expenseItem.classList.add('editing');
      
      const editForm = `
        <div class="edit-form">
          <div>
            <label>Amount (UGX)</label>
            <input type="number" id="edit-amount-${docId}" value="${expense.amount}" min="0" step="100" required>
          </div>
          <div>
            <label>Category</label>
            <select id="edit-category-${docId}" required>
              <option value="Yaka" ${expense.category === 'Yaka' ? 'selected' : ''}>⚡ Yaka</option>
              <option value="Water" ${expense.category === 'Water' ? 'selected' : ''}>💧 Water</option>
              <option value="Groceries" ${expense.category === 'Groceries' ? 'selected' : ''}>🛒 Groceries</option>
              <option value="Food" ${expense.category === 'Food' ? 'selected' : ''}>🍲 Food</option>
              <option value="Fuel" ${expense.category === 'Fuel' ? 'selected' : ''}>⛽ Fuel</option>
              <option value="Transport" ${expense.category === 'Transport' ? 'selected' : ''}>🚗 Transport</option>
              <option value="Internet" ${expense.category === 'Internet' ? 'selected' : ''}>🌐 Internet</option>
              <option value="Airtime" ${expense.category === 'Airtime' ? 'selected' : ''}>📱 Airtime</option>
              <option value="Rent" ${expense.category === 'Rent' ? 'selected' : ''}>🏠 Rent</option>
              <option value="Laundry" ${expense.category === 'Laundry' ? 'selected' : ''}>👕 Laundry</option>
              <option value="Clothing" ${expense.category === 'Clothing' ? 'selected' : ''}>👔 Clothing</option>
              <option value="School Fees" ${expense.category === 'School Fees' ? 'selected' : ''}>📚 School Fees</option>
              <option value="Medical" ${expense.category === 'Medical' ? 'selected' : ''}>🏥 Medical</option>
              <option value="Savings" ${expense.category === 'Savings' ? 'selected' : ''}>💰 Savings</option>
              <option value="Debt" ${expense.category === 'Debt' ? 'selected' : ''}>💳 Debt</option>
              <option value="Giving" ${expense.category === 'Giving' ? 'selected' : ''}>🤲 Giving</option>
              <option value="Entertainment" ${expense.category === 'Entertainment' ? 'selected' : ''}>🎬 Entertainment</option>
              <option value="General" ${expense.category === 'General' ? 'selected' : ''}>📦 General</option>
            </select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="edit-date-${docId}" value="${expense.date}" required>
          </div>
          <div>
            <label>Description</label>
            <input type="text" id="edit-description-${docId}" value="${expense.description || ''}" placeholder="Optional">
          </div>
          <div class="edit-actions">
            <button class="btn btn-save" onclick="saveEditExpense('${docId}')">
              <i class="fas fa-save"></i> Save
            </button>
            <button class="btn btn-cancel" onclick="cancelEditExpense('${docId}')">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </div>
      `;
      
      const expenseDetails = expenseItem.querySelector('.expense-details');
      if (expenseDetails) {
        expenseDetails.insertAdjacentHTML('beforeend', editForm);
      }
    }

    // Save edited expense
    async function saveEditExpense(docId) {
      if (!isFirestoreReady) {
        showMessage('⚠️ Please connect to Firebase first', 'error');
        return;
      }

      const amount = document.getElementById(`edit-amount-${docId}`).value.trim();
      const category = document.getElementById(`edit-category-${docId}`).value;
      const date = document.getElementById(`edit-date-${docId}`).value;
      const description = document.getElementById(`edit-description-${docId}`).value.trim();

      if (!amount || !date) {
        showMessage('❌ Amount and date are required', 'error');
        return;
      }

      if (parseFloat(amount) <= 0 || isNaN(parseFloat(amount))) {
        showMessage('❌ Please enter a valid amount', 'error');
        return;
      }

      try {
        const expenseData = {
          amount: parseFloat(amount),
          category: category,
          date: date,
          description: description || '',
          monthKey: getMonthKey(date),
          weekKey: getWeekKey(date),
          dayKey: getDayKey(date),
          yearKey: getYearKey(date),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAtTimestamp: new Date().toISOString()
        };

        await db.collection('expenses').doc(docId).update(expenseData);

        showMessage(`✅ Updated expense to ${formatCurrency(amount)} for ${category}`, 'success');
        
        currentlyEditing = null;
        loadInitialData();

      } catch (error) {
        console.error('Error updating expense:', error);
        showMessage('❌ Error updating expense: ' + error.message, 'error');
      }
    }

    // Cancel editing
    function cancelEditExpense(docId) {
      const expenseItem = document.getElementById(`expense-${docId}`);
      if (expenseItem) {
        expenseItem.classList.remove('editing');
        const editForm = expenseItem.querySelector('.edit-form');
        if (editForm) {
          editForm.remove();
        }
      }
      currentlyEditing = null;
    }

    // Show delete confirmation modal
    function showDeleteConfirmation(docId, expense) {
      expenseToDelete = docId;
      const detailsDiv = document.getElementById('deleteExpenseDetails');
      const date = new Date(expense.date);
      const formattedDate = date.toLocaleDateString('en-UG', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
      
      detailsDiv.innerHTML = `
        <div>${formattedDate} • ${expense.category}</div>
        <div>${expense.description || 'No description'}</div>
        <div style="color: var(--danger); margin-top: 5px;">${formatCurrency(expense.amount)}</div>
      `;
      
      document.getElementById('deleteModal').style.display = 'flex';
    }

    // Delete expense
    async function deleteExpense() {
      if (!expenseToDelete || !isFirestoreReady) {
        document.getElementById('deleteModal').style.display = 'none';
        return;
      }

      try {
        await db.collection('expenses').doc(expenseToDelete).delete();
        showMessage('✅ Expense deleted successfully', 'success');
        
        document.getElementById('deleteModal').style.display = 'none';
        expenseToDelete = null;
        loadInitialData();
        
      } catch (error) {
        console.error('Error deleting expense:', error);
        showMessage('❌ Error deleting expense: ' + error.message, 'error');
        document.getElementById('deleteModal').style.display = 'none';
      }
    }

    // Load expenses
    async function loadExpenses() {
      if (!isFirestoreReady) return;

      try {
        const now = new Date();
        const currentMonth = getMonthKey(now.toISOString().split('T')[0]);
        
        // Try composite query first, fall back to simple query
        let snapshot;
        try {
          snapshot = await db.collection('expenses')
            .where('monthKey', '==', currentMonth)
            .orderBy('timestamp', 'desc')
            .limit(50)
            .get();
        } catch (indexError) {
          // Fallback: Get all and filter client-side
          const allSnapshot = await db.collection('expenses')
            .orderBy('timestamp', 'desc')
            .limit(100)
            .get();
          
          // Filter client-side
          snapshot = {
            forEach: (callback) => {
              allSnapshot.forEach(doc => {
                const data = doc.data();
                if (data.monthKey === currentMonth) {
                  callback({ data: () => data, id: doc.id });
                }
              });
            },
            empty: allSnapshot.empty
          };
        }

        let html = '';
        
        if (!snapshot || (typeof snapshot.empty === 'function' ? snapshot.empty() : snapshot.empty)) {
          html = `
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <h4>No expenses yet</h4>
              <p>Add your first expense to get started!</p>
            </div>
          `;
        } else {
          snapshot.forEach(doc => {
            const expense = typeof doc.data === 'function' ? doc.data() : doc.data;
            const docId = doc.id;
            const date = new Date(expense.date);
            const formattedDate = date.toLocaleDateString('en-UG', {
              weekday: 'short',
              month: 'short',
              day: 'numeric'
            });

            html += `
              <div class="expense-item" id="expense-${docId}">
                <div class="expense-details">
                  <span class="category-badge category-${expense.category.toLowerCase().replace(' ', '-')}">
                    <i class="fas fa-tag"></i>
                    ${expense.category}
                  </span>
                  <strong>${formattedDate}</strong>
                  <div style="font-size: 0.9rem; color: var(--gray); margin-top: 5px;">
                    ${expense.description || ''}
                  </div>
                </div>
                <div class="expense-amount">
                  ${formatCurrency(expense.amount)}
                </div>
                <div class="action-buttons">
                  <button class="btn btn-edit" onclick="startEditExpense('${docId}', ${JSON.stringify(expense).replace(/"/g, '&quot;')})" ${currentlyEditing ? 'disabled' : ''}>
                    <i class="fas fa-edit"></i> Edit
                  </button>
                  <button class="btn btn-delete" onclick="showDeleteConfirmation('${docId}', ${JSON.stringify(expense).replace(/"/g, '&quot;')})">
                    <i class="fas fa-trash"></i> Delete
                  </button>
                </div>
              </div>
            `;
          });
        }

        document.getElementById('expensesList').innerHTML = html;

      } catch (error) {
        console.error('Error loading expenses:', error);
        document.getElementById('expensesList').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h4>Error loading expenses</h4>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // Update stats
    async function updateStats() {
      if (!isFirestoreReady) return;

      try {
        const snapshot = await db.collection('expenses').get();
        
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentWeek = getWeekKey(today);
        const currentMonth = getMonthKey(today);
        const currentYear = getYearKey(today);
        
        let todayTotal = 0;
        let weekTotal = 0;
        let monthTotal = 0;
        let yearTotal = 0;
        
        snapshot.forEach(doc => {
          const expense = doc.data();
          
          if (expense.dayKey === today) todayTotal += expense.amount;
          if (expense.weekKey === currentWeek) weekTotal += expense.amount;
          if (expense.monthKey === currentMonth) monthTotal += expense.amount;
          if (expense.yearKey === currentYear) yearTotal += expense.amount;
        });

        document.getElementById('todayTotal').textContent = formatCurrency(todayTotal);
        document.getElementById('weekTotal').textContent = formatCurrency(weekTotal);
        document.getElementById('monthTotal').textContent = formatCurrency(monthTotal);
        document.getElementById('yearTotal').textContent = formatCurrency(yearTotal);

      } catch (error) {
        console.error('Error updating stats:', error);
      }
    }

    // Load initial data
    async function loadInitialData() {
      await loadExpenses();
      await updateStats();
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', function() {
      const checkFirebaseInterval = setInterval(() => {
        if (isFirebaseLoaded()) {
          clearInterval(checkFirebaseInterval);
          initializeFirebase();
        }
      }, 100);
      
      setTimeout(() => {
        clearInterval(checkFirebaseInterval);
        if (!isFirebaseLoaded()) {
          updateStatus('offline', 'Firebase timeout');
          showMessage('❌ Firebase SDK took too long to load. Please refresh.', 'error');
        }
      }, 10000);
    });

    // Auto-refresh data every 60 seconds
    setInterval(() => {
      if (isFirestoreReady && !currentlyEditing) {
        loadExpenses();
        updateStats();
      }
    }, 60000);
  </script>
</body>
</html>
