    // Initialize Firebase
    function initFirebase() {
      try {
        // Check if Firebase is loaded
        if (typeof firebase === 'undefined') {
          console.error('Firebase SDK not loaded');
          updateStatus('offline', 'Firebase not loaded');
          showError('Firebase SDK failed to load. Please refresh the page.');
          return;
        }

        console.log('Firebase is available, initializing...');
        
        // Initialize Firebase
        let app;
        if (firebase.apps.length === 0) {
          app = firebase.initializeApp(firebaseConfig);
          console.log('Firebase app initialized');
        } else {
          app = firebase.app();
          console.log('Using existing Firebase app');
        }
        
        // Initialize Firestore
        db = firebase.firestore(app);
        console.log('Firestore initialized');
        
        updateStatus('connecting', 'Connecting to database...');
        
        // Test connection immediately
        testConnection();
        
      } catch (error) {
        console.error('Firebase initialization error:', error);
        updateStatus('offline', 'Initialization failed');
        showError('Firebase initialization failed: ' + error.message);
      }
    }

    // Test Firestore connection with better error handling
    async function testConnection() {
      try {
        console.log('Testing Firestore connection...');
        
        // Set a timeout for the connection test
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Connection timeout')), 10000)
        );
        
        // Try to read from expenses collection
        const testPromise = db.collection('expenses').limit(1).get();
        
        // Race between the test and timeout
        await Promise.race([testPromise, timeoutPromise]);
        
        // If we get here, connection is good
        isFirestoreReady = true;
        updateStatus('online', 'Connected ✓');
        showMessage('✅ Successfully connected to database! Tap on balance cards to reveal amounts', 'success');
        
        // Setup the app
        setupApp();
        loadDashboard();
        
        // Generate initial report after a short delay
        setTimeout(() => {
          try {
            generateReport('today');
          } catch (err) {
            console.error('Error generating initial report:', err);
          }
        }, 1500);
        
        console.log('Firestore connection successful');
        
      } catch (error) {
        console.error('Firestore connection failed:', error);
        
        // Check if it's a permissions error
        if (error.message && error.message.includes('permission')) {
          updateStatus('offline', 'Permission denied');
          showError('Database permission denied. Please check Firebase rules.');
        } else if (error.message && error.message.includes('timeout')) {
          updateStatus('offline', 'Connection timeout');
          showError('Connection timeout. Please check your internet connection.');
        } else {
          updateStatus('offline', 'Connection failed');
          showError('Could not connect to database: ' + error.message);
        }
        
        // Try to set up app anyway for offline mode
        isFirestoreReady = true;
        setupApp();
      }
    }

    // Load revealed state from localStorage
    function loadRevealedState() {
      try {
        const savedState = localStorage.getItem('revealedBalances');
        if (savedState) {
          revealedBalances = JSON.parse(savedState);
          
          // Update UI based on saved state
          const periods = ['today', 'week', 'month', 'year', 'income', 'expenses', 'balance'];
          periods.forEach(period => {
            const elementId = getElementId(period);
            const element = document.getElementById(elementId);
            if (element) {
              if (revealedBalances[period]) {
                element.classList.remove('hidden');
              } else {
                element.classList.add('hidden');
              }
            }
          });
        }
      } catch (error) {
        console.error('Error loading revealed state:', error);
      }
    }

    // Helper function to get element ID
    function getElementId(period) {
      const elementMap = {
        'today': 'todayTotal',
        'week': 'weekTotal',
        'month': 'monthTotal',
        'year': 'yearTotal',
        'income': 'totalIncome',
        'expenses': 'totalExpenses',
        'balance': 'availableBalance'
      };
      return elementMap[period] || `${period}Total`;
    }

    // Save revealed state to localStorage
    function saveRevealedState() {
      try {
        localStorage.setItem('revealedBalances', JSON.stringify(revealedBalances));
      } catch (error) {
        console.error('Error saving revealed state:', error);
      }
    }

    // Toggle balance visibility
    function toggleBalance(period) {
      const elementId = getElementId(period);
      const element = document.getElementById(elementId);
      
      if (!element) {
        console.error('Element not found for period:', period);
        return;
      }
      
      // Get the card for animation
      const card = document.getElementById(`${period}Card`);
      if (card) {
        card.classList.add('tapped');
        setTimeout(() => card.classList.remove('tapped'), 500);
      }
      
      // Toggle visibility
      if (element.classList.contains('hidden')) {
        element.classList.remove('hidden');
        revealedBalances[period] = true;
        showMessage(`📊 ${period.charAt(0).toUpperCase() + period.slice(1)} revealed!`, 'info');
      } else {
        element.classList.add('hidden');
        revealedBalances[period] = false;
        showMessage(`👁️ ${period.charAt(0).toUpperCase() + period.slice(1)} hidden`, 'info');
      }
      
      saveRevealedState();
    }

      const icon = type === 'success' ? 'fa-check-circle' : 
                   type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      
      messageDiv.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
      messageDiv.className = `message ${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {

            messageDiv.classList.remove('show');

      }
    }

    // Format currency
    function formatCurrency(amount) {
      if (isNaN(amount) || amount === null || amount === undefined) {
        return 'UGX 0';
      }
      return 'UGX ' + parseInt(amount).toLocaleString('en-UG');
    }

    // Add expense
    async function addExpense() {
      if (!isFirestoreReady) {
        showError('Please wait for database connection');
        return;
      }

      const amountInput = document.getElementById('amount');
      const categoryInput = document.getElementById('category');
      const dateInput = document.getElementById('date');
      const descriptionInput = document.getElementById('description');
      
      if (!amountInput || !categoryInput || !dateInput) {
        showError('Form elements not found');
        return;
      }

      const amount = amountInput.value.trim();
      const category = categoryInput.value;
      const date = dateInput.value;
      const description = descriptionInput ? descriptionInput.value.trim() : '';

      if (!amount || parseFloat(amount) <= 0) {
        showError('Please enter a valid amount');
        return;
      }

      if (!date) {
        showError('Please select a date');
        return;
      }

      const addBtn = document.getElementById('addBtn');
      const originalText = addBtn.innerHTML;
      
      try {
        addBtn.disabled = true;
        addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

        const expenseData = {
          amount: parseFloat(amount),
          category: category,
          date: date,
          description: description || '',
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          createdAt: new Date().toISOString()
        };

        console.log('Adding expense:', expenseData);
        
        await db.collection('expenses').add(expenseData);

        // Clear form
        amountInput.value = '';
        if (descriptionInput) descriptionInput.value = '';

        showMessage(`✅ Added expense: ${formatCurrency(amount)} for ${category}`, 'success');
        
        // Refresh data
        loadDashboard();
        if (currentReportType) {
          setTimeout(() => generateReport(currentReportType), 1000);
        }

      } catch (error) {
        console.error('Error adding expense:', error);
        showError('Failed to add expense: ' + error.message);
      } finally {
        addBtn.disabled = false;
        addBtn.innerHTML = originalText;
      }
    }

    // Load dashboard data
    async function loadDashboard() {
      if (!isFirestoreReady) {
        showError('Database not ready');
        return;
      }

      try {
        console.log('Loading dashboard data...');
        
        // Load expenses and incomes in parallel
        const [expensesSnapshot, incomesSnapshot] = await Promise.all([
          db.collection('expenses').get().catch(err => {
            console.error('Error loading expenses:', err);
            return { empty: true, forEach: () => {} };
          }),
          db.collection('incomes').get().catch(err => {
            console.error('Error loading incomes:', err);
            return { empty: true, forEach: () => {} };
          })
        ]);

        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentMonth = now.getMonth();
        const currentYear = now.getFullYear();
        
        // Calculate totals
        const stats = {
          today: 0,
          week: 0,
          month: 0,
          year: 0,
          totalIncome: 0,
          totalExpenses: 0,
          todayDate: today,
          currentYear: now.getFullYear(),
          currentMonth: now.getMonth() + 1
        };

        // Categorize expenses
        const categories = {};
        const weeklyData = Array(7).fill(0);
        
        // Calculate week ago date
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        
        console.log(`Found ${expensesSnapshot.size} expenses, ${incomesSnapshot.size} incomes`);

        // Process expenses
        expensesSnapshot.forEach(doc => {
          const expense = doc.data();
          if (!expense || !expense.amount || !expense.date) return;
          
          const expenseDate = new Date(expense.date);
          if (isNaN(expenseDate.getTime())) return;
          
          const amount = parseFloat(expense.amount) || 0;
          
          // Today
          if (expense.date === today) {
            stats.today += amount;
          }
          
          // This week (last 7 days)
          if (expenseDate > weekAgo) {
            stats.week += amount;
          }
          
          // This month
          if (expenseDate.getMonth() === currentMonth && expenseDate.getFullYear() === currentYear) {
            stats.totalExpenses += amount;
            stats.month += amount;
          }
          
          // This year
          if (expenseDate.getFullYear() === currentYear) {
            stats.year += amount;
          }
          
          // Category totals
          if (expense.category) {
            categories[expense.category] = (categories[expense.category] || 0) + amount;
          }
          
          // Weekly data for chart
          const dayOfWeek = expenseDate.getDay();
          weeklyData[dayOfWeek] += amount;
        });

        // Process incomes
        incomesSnapshot.forEach(doc => {
          const income = doc.data();
          if (!income || !income.amount || !income.date) return;
          
          const incomeDate = new Date(income.date);
          if (isNaN(incomeDate.getTime())) return;
          
          const amount = parseFloat(income.amount) || 0;
          
          // This month income
          if (incomeDate.getMonth() === currentMonth && incomeDate.getFullYear() === currentYear) {
            stats.totalIncome += amount;
          }
        });

        console.log('Dashboard stats calculated:', stats);
        
        // Update UI
        updateStatsUI(stats);
        updateCharts(categories, weeklyData);
        loadTransactionsList(expensesSnapshot, incomesSnapshot);

        showMessage('✅ Dashboard data refreshed', 'success');

      } catch (error) {
        console.error('Failed to load dashboard:', error);
        showError('Failed to load dashboard: ' + error.message);
      }
    }

    // Update stats UI
    function updateStatsUI(stats) {
      console.log('Updating stats UI with:', stats);
      
      // Update values (keep hidden state)
      const elements = {
        'todayTotal': stats.today,
        'weekTotal': stats.week,
        'monthTotal': stats.month,
        'yearTotal': stats.year,
        'totalIncome': stats.totalIncome,
        'totalExpenses': stats.totalExpenses
      };
      
      Object.entries(elements).forEach(([id, value]) => {
        const element = document.getElementById(id);
        if (element) {
          element.textContent = formatCurrency(value);
        }
      });
      
      // Calculate and update available balance
      const availableBalance = stats.totalIncome - stats.totalExpenses;
      const balanceElement = document.getElementById('availableBalance');
      if (balanceElement) {
        balanceElement.textContent = formatCurrency(availableBalance);
        
        // Update balance color based on value
        if (availableBalance >= 0) {
          balanceElement.classList.add('balance');
          balanceElement.classList.remove('income');
        } else {
          balanceElement.classList.add('income');
          balanceElement.classList.remove('balance');
        }
      }

      // Calculate percentage changes
      const calculateChange = (current, previous) => {
        if (previous === undefined || previous === 0) return '--';
        const change = ((current - previous) / previous * 100).toFixed(1);
        return change > 0 ? `+${change}% 📈` : `${change}% 📉`;
      };

      // Update changes
      const changes = {
        'todayChange': stats.today,
        'weekChange': stats.week,
        'monthChange': stats.month,
        'yearChange': stats.year,
        'incomeChange': stats.totalIncome,
        'expensesChange': stats.totalExpenses
      };
      
      Object.entries(changes).forEach(([id, current]) => {
        const element = document.getElementById(id);
        if (element) {
          const previous = previousStats[id.replace('Change', '')] || 0;
          element.textContent = calculateChange(current, previous);
          
          // Add color classes
          element.classList.remove('positive', 'negative');
          if (previous > 0) {
            if (current > previous) {
              element.classList.add('positive');
            } else if (current < previous) {
              element.classList.add('negative');
            }
          }
        }
      });
      
      // Update balance change
      const currentBalance = availableBalance;
      const previousBalance = (previousStats.totalIncome || 0) - (previousStats.totalExpenses || 0);
      const balanceChange = document.getElementById('balanceChange');
      if (balanceChange) {
        balanceChange.textContent = calculateChange(currentBalance, previousBalance);
        
        balanceChange.classList.remove('positive', 'negative');
        if (previousBalance > 0) {
          if (currentBalance > previousBalance) {
            balanceChange.classList.add('positive');
          } else if (currentBalance < previousBalance) {
            balanceChange.classList.add('negative');
          }
        } else if (currentBalance > 0) {
          balanceChange.classList.add('positive');
        }
      }

      // Store for next comparison
      previousStats = {
        today: stats.today,
        week: stats.week,
        month: stats.month,
        year: stats.year,
        totalIncome: stats.totalIncome,
        totalExpenses: stats.totalExpenses
      };
    }

    // Load transactions list
    function loadTransactionsList(expensesSnapshot, incomesSnapshot) {
      const container = document.getElementById('expensesList');
      if (!container) return;
      
      const hasExpenses = expensesSnapshot && !expensesSnapshot.empty;
      const hasIncomes = incomesSnapshot && !incomesSnapshot.empty;
      
      if (!hasExpenses && !hasIncomes) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h4>No transactions yet</h4>
            <p>Add your first expense or income to get started!</p>
          </div>
        `;
        return;
      }

      let transactions = [];
      
      // Add expenses
      if (hasExpenses) {
        expensesSnapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.amount && data.date) {
            transactions.push({
              id: doc.id,
              ...data,
              type: 'expense'
            });
          }
        });
      }
      
      // Add incomes
      if (hasIncomes) {
        incomesSnapshot.forEach(doc => {
          const data = doc.data();
          if (data && data.amount && data.date) {
            transactions.push({
              id: doc.id,
              ...data,
              type: 'income',
              category: data.type || 'Income'
            });
          }
        });
      }

      // Sort by date (newest first)
      transactions.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        return dateB - dateA;
      });

      // Take only last 20
      const displayTransactions = transactions.slice(0, 20);
      
      let html = '';
      
      if (displayTransactions.length === 0) {
        html = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h4>No transactions yet</h4>
            <p>Add your first expense or income to get started!</p>
          </div>
        `;
      } else {
        displayTransactions.forEach(transaction => {
          const date = new Date(transaction.date);
          const formattedDate = date.toLocaleDateString('en-UG', {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
          });

          const isIncome = transaction.type === 'income';
          const category = transaction.category || 'General';
          const badgeClass = category.toLowerCase().replace(/[^a-z0-9]/g, '-');
          
          html += `
            <div class="expense-item">
              <div>
                <span class="category-badge category-${badgeClass}" style="${isIncome ? 'background: var(--gradient-income); color: white;' : ''}">
                  <i class="fas ${isIncome ? 'fa-money-bill-wave' : 'fa-tag'}"></i>
                  ${category}
                </span>
                <strong>${formattedDate}</strong>
                <div style="font-size: 0.9rem; color: var(--gray); margin-top: 5px;">
                  ${transaction.description || 'No description'}
                </div>
              </div>
              <div class="expense-amount" style="${isIncome ? 'background: linear-gradient(135deg, var(--income), #059669); -webkit-background-clip: text;' : ''}">
                ${isIncome ? '+' : ''}${formatCurrency(transaction.amount)}
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // Generate report
    async function generateReport(type) {
      if (!isFirestoreReady) {
        showError('Database not ready');
        return;
      }

      currentReportType = type;
      const customRangeDiv = document.getElementById('customRange');
      if (customRangeDiv) customRangeDiv.style.display = 'none';
      
      try {
        const dateRange = getDateRange(type);
        if (!dateRange) {
          showError('Invalid report type');
          return;
        }
        
        await fetchAndDisplayReport(dateRange.startDate, dateRange.endDate, dateRange.periodLabel, type);

      } catch (error) {
        console.error('Error generating report:', error);
        const reportResults = document.getElementById('reportResults');
        if (reportResults) {
          reportResults.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <h4>Error generating report</h4>
              <p>${error.message}</p>
            </div>
          `;
        }
        const reportActions = document.getElementById('reportActions');
        if (reportActions) reportActions.style.display = 'none';
      }
    }

    // Get date range for report type
    function getDateRange(type) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      let startDate, endDate, periodLabel;
      
      switch(type) {
        case 'today':
          startDate = new Date(today);
          endDate = new Date(today);
          endDate.setHours(23, 59, 59, 999);
          periodLabel = 'Today (' + today.toLocaleDateString('en-UG') + ')';
          break;
          
        case 'yesterday':
          startDate = new Date(today);
          startDate.setDate(startDate.getDate() - 1);
          endDate = new Date(startDate);
          endDate.setHours(23, 59, 59, 999);
          periodLabel = 'Yesterday (' + startDate.toLocaleDateString('en-UG') + ')';
          break;
          
        case 'week':
          startDate = new Date(today);
          startDate.setDate(startDate.getDate() - 7);
          endDate = new Date(today);
          endDate.setHours(23, 59, 59, 999);
          periodLabel = 'Last 7 Days';
          break;
          
        case 'month':
          startDate = new Date(today.getFullYear(), today.getMonth(), 1);
          endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
          endDate.setHours(23, 59, 59, 999);
          periodLabel = 'This Month (' + startDate.toLocaleDateString('en-UG', { month: 'long', year: 'numeric' }) + ')';
          break;
          
        case 'year':
          startDate = new Date(today.getFullYear(), 0, 1);
          endDate = new Date(today.getFullYear(), 11, 31);
          endDate.setHours(23, 59, 59, 999);
          periodLabel = 'This Year (' + today.getFullYear() + ')';
          break;
          
        default:
          return null;
      }
      
      return { startDate, endDate, periodLabel };
    }

    // Fetch and display report
    async function fetchAndDisplayReport(startDate, endDate, periodLabel, type) {
      const reportResults = document.getElementById('reportResults');
      if (!reportResults) return;
      
      reportResults.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Generating report...</p>
        </div>
      `;

      try {
        // Load data in parallel
        const [expensesSnapshot, incomesSnapshot] = await Promise.all([
          db.collection('expenses').get(),
          db.collection('incomes').get()
        ]);

        let totalIncome = 0;
        let totalExpenses = 0;
        let expenseCount = 0;
        let incomeCount = 0;
        const categories = {};
        const incomeTypes = {};
        const transactions = [];

        // Process expenses
        expensesSnapshot.forEach(doc => {
          const expense = doc.data();
          if (!expense || !expense.amount || !expense.date) return;
          
          const expenseDate = new Date(expense.date);
          if (isNaN(expenseDate.getTime())) return;
          expenseDate.setHours(0, 0, 0, 0);
          
          if (expenseDate >= startDate && expenseDate <= endDate) {
            const amount = parseFloat(expense.amount) || 0;
            totalExpenses += amount;
            expenseCount++;
            
            if (expense.category) {
              categories[expense.category] = (categories[expense.category] || 0) + amount;
            }
            
            transactions.push({
              id: doc.id,
              ...expense,
              type: 'expense'
            });
          }
        });

        // Process incomes
        incomesSnapshot.forEach(doc => {
          const income = doc.data();
          if (!income || !income.amount || !income.date) return;
          
          const incomeDate = new Date(income.date);
          if (isNaN(incomeDate.getTime())) return;
          incomeDate.setHours(0, 0, 0, 0);
          
          if (incomeDate >= startDate && incomeDate <= endDate) {
            const amount = parseFloat(income.amount) || 0;
            totalIncome += amount;
            incomeCount++;
            
            if (income.type) {
              incomeTypes[income.type] = (incomeTypes[income.type] || 0) + amount;
            }
            
            transactions.push({
              id: doc.id,
              ...income,
              type: 'income',
              category: income.type || 'Income'
            });
          }
        });

        // Sort categories and income types
        const sortedCategories = Object.entries(categories)
          .sort((a, b) => b[1] - a[1]);
        const sortedIncomeTypes = Object.entries(incomeTypes)
          .sort((a, b) => b[1] - a[1]);
        
        // Sort transactions by date
        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        // Store report data
        currentReportData = {
          periodLabel,
          startDate,
          endDate,
          totalIncome,
          totalExpenses,
          expenseCount,
          incomeCount,
          categories: sortedCategories,
          incomeTypes: sortedIncomeTypes,
          transactions,
          type
        };

        // Generate HTML for report
        let html = `
          <h4 style="color: var(--primary-dark); margin-bottom: 15px; font-size: 1.2rem;">
            <i class="fas fa-chart-bar"></i> ${periodLabel}
          </h4>
          <div class="report-summary">
            <div class="report-summary-item">
              <div class="label">Total Income</div>
              <div class="value" style="color: var(--income);">${formatCurrency(totalIncome)}</div>
            </div>
            <div class="report-summary-item">
              <div class="label">Total Expenses</div>
              <div class="value">${formatCurrency(totalExpenses)}</div>
            </div>
            <div class="report-summary-item">
              <div class="label">Net Balance</div>
              <div class="value" style="color: ${totalIncome >= totalExpenses ? 'var(--income)' : 'var(--danger)'};">${formatCurrency(totalIncome - totalExpenses)}</div>
            </div>
            <div class="report-summary-item">
              <div class="label">Date Range</div>
              <div class="value" style="font-size: 1rem;">${startDate.toLocaleDateString('en-UG', { day: 'numeric', month: 'short', year: 'numeric' })} - ${endDate.toLocaleDateString('en-UG', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
            </div>
          </div>
        `;

        if (sortedIncomeTypes.length > 0) {
          html += `
            <div class="category-breakdown" style="margin-top: 25px;">
              <h5 style="color: var(--income); margin-bottom: 15px; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-money-bill-wave"></i> Income Breakdown
              </h5>
          `;
          
          sortedIncomeTypes.forEach(([type, amount]) => {
            const percentage = totalIncome > 0 ? Math.round((amount / totalIncome) * 100) : 0;
            html += `
              <div class="category-item">
                <div class="category-name">
                  <span style="padding: 4px 8px; background: var(--income-light); border-radius: 12px; font-size: 0.8rem; color: var(--income); font-weight: 600;">
                    ${type}
                  </span>
                </div>
                <div class="category-bar">
                  <div class="category-fill" style="background: linear-gradient(90deg, var(--income), #059669); width: ${percentage}%"></div>
                </div>
                <div class="category-amount" style="color: var(--income);">${formatCurrency(amount)}</div>
                <div class="category-percentage">${percentage}%</div>
              </div>
            `;
          });
          
          html += `</div>`;
        }

        if (sortedCategories.length > 0) {
          html += `
            <div class="category-breakdown">
              <h5 style="color: var(--primary-dark); margin-bottom: 15px; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-tags"></i> Expense Breakdown
              </h5>
          `;
          
          sortedCategories.forEach(([category, amount]) => {
            const percentage = totalExpenses > 0 ? Math.round((amount / totalExpenses) * 100) : 0;
            const badgeClass = category.toLowerCase().replace(/[^a-z0-9]/g, '-');
            html += `
              <div class="category-item">
                <div class="category-name">
                  <span class="category-badge category-${badgeClass}" style="margin-right: 8px;">
                    ${category}
                  </span>
                </div>
                <div class="category-bar">
                  <div class="category-fill" style="width: ${percentage}%"></div>
                </div>
                <div class="category-amount">${formatCurrency(amount)}</div>
                <div class="category-percentage">${percentage}%</div>
              </div>
            `;
          });
          
          html += `</div>`;
        }

        if (transactions.length > 0) {
          html += `
            <div style="margin-top: 25px;">
              <h5 style="color: var(--primary-dark); margin-bottom: 15px; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-receipt"></i> Recent Transactions (${transactions.length} items)
              </h5>
          `;
          
          transactions.slice(0, 20).forEach(transaction => {
            const date = new Date(transaction.date);
            const formattedDate = date.toLocaleDateString('en-UG', {
              weekday: 'short',
              month: 'short',
              day: 'numeric'
            });
            
            const isIncome = transaction.type === 'income';
            const category = transaction.category || 'General';
            const badgeClass = category.toLowerCase().replace(/[^a-z0-9]/g, '-');
            
            html += `
              <div class="expense-item">
                <div class="expense-details">
                  <span class="category-badge category-${badgeClass}" style="${isIncome ? 'background: var(--gradient-income); color: white;' : ''}">
                    <i class="fas ${isIncome ? 'fa-money-bill-wave' : 'fa-tag'}"></i>
                    ${category}
                  </span>
                  <strong>${formattedDate}</strong>
                  <div style="font-size: 0.8rem; color: var(--gray); margin-top: 3px;">
                    ${transaction.description || ''}
                  </div>
                </div>
                <div class="expense-amount" style="${isIncome ? 'background: linear-gradient(135deg, var(--income), #059669); -webkit-background-clip: text;' : ''}">
                  ${isIncome ? '+' : ''}${formatCurrency(transaction.amount)}
                </div>
              </div>
            `;
          });
          
          html += `</div>`;
        }

        if (transactions.length === 0) {
          html += `
            <div class="empty-state" style="margin-top: 30px;">
              <i class="fas fa-chart-line"></i>
              <h4>No transactions found</h4>
              <p>No transactions recorded for this period.</p>
            </div>
          `;
        }

        reportResults.innerHTML = html;
        
        // Show PDF download button if there are transactions
        const reportActions = document.getElementById('reportActions');
        if (reportActions) {
          reportActions.style.display = transactions.length > 0 ? 'flex' : 'none';
        }

        showMessage(`📊 Report generated for ${periodLabel}`, 'success');

      } catch (error) {
        console.error('Error fetching report:', error);
        reportResults.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h4>Error generating report</h4>
            <p>${error.message}</p>
          </div>
        `;
        const reportActions = document.getElementById('reportActions');
        if (reportActions) reportActions.style.display = 'none';
        showError('Failed to generate report: ' + error.message);
      }
    }

    // Update charts
    function updateCharts(categories, weeklyData) {
      // Pie Chart
      const pieCtx = document.getElementById('pieChart');
      if (!pieCtx) return;
      
      const pieContext = pieCtx.getContext('2d');
      const categoryColors = [
        '#667eea', '#f093fb', '#f5576c', '#4ecdc4',
        '#ffd166', '#06d6a0', '#a78bfa', '#f97316',
        '#84cc16', '#ef4444', '#8b5cf6', '#10b981'
      ];

      if (pieChart) {
        pieChart.destroy();
      }
      
      if (Object.keys(categories).length > 0) {
        pieChart = new Chart(pieContext, {
          type: 'doughnut',
          data: {
            labels: Object.keys(categories),
            datasets: [{
              data: Object.values(categories),
              backgroundColor: categoryColors,
              borderColor: '#ffffff',
              borderWidth: 2,
              hoverOffset: 15
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  padding: 20,
                  usePointStyle: true,
                  pointStyle: 'circle'
                }
              },
              tooltip: {
                callbacks: {
                  label: (context) => {
                    const value = context.raw;
                    const total = Object.values(categories).reduce((a, b) => a + b, 0);
                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                    return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                  }
                }
              }
            },
            cutout: '70%',
            animation: {
              animateRotate: true,
              animateScale: true
            }
          }
        });
      } else {
        pieCtx.parentNode.innerHTML = '<p style="color: var(--gray); text-align: center; padding: 40px;">No expense data available for chart</p>';
      }

      // Bar Chart
      const barCtx = document.getElementById('barChart');
      if (!barCtx) return;
      
      const barContext = barCtx.getContext('2d');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      if (barChart) {
        barChart.destroy();
      }
      
      barChart = new Chart(barContext, {
        type: 'bar',
        data: {
          labels: days,
          datasets: [{
            label: 'Expenses (UGX)',
            data: weeklyData,
            backgroundColor: 'rgba(102, 126, 234, 0.7)',
            borderColor: '#667eea',
            borderWidth: 2,
            borderRadius: 8,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: (value) => formatCurrency(value).replace('UGX ', '')
              }
            }
          },
          animation: {
            duration: 1000,
            easing: 'easeOutQuart'
          }
        }
      });
    }

    // Modal functions
    function hideDeleteModal() {
      const modal = document.getElementById('deleteModal');
      if (modal) modal.style.display = 'none';
    }

    async function deleteExpense() {
      if (!expenseToDelete || !isFirestoreReady) {
        hideDeleteModal();
        return;
      }

      try {
        await db.collection('expenses').doc(expenseToDelete).delete();
        showMessage('✅ Expense deleted successfully', 'success');
        hideDeleteModal();
        loadDashboard();
        if (currentReportType) generateReport(currentReportType);
      } catch (error) {
        showError('Failed to delete expense: ' + error.message);
        hideDeleteModal();
      }
    }

    // Show custom range inputs
    function showCustomRange() {
      const customRange = document.getElementById('customRange');
      if (customRange) customRange.style.display = 'flex';
      
      const reportButtons = document.querySelectorAll('.report-controls .btn');
      reportButtons.forEach(b => b.classList.remove('active'));
    }

    // Generate custom report
    async function generateCustomReport() {
      const fromDateInput = document.getElementById('fromDate');
      const toDateInput = document.getElementById('toDate');
      
      if (!fromDateInput || !toDateInput) {
        showMessage('❌ Date inputs not found', 'error');
        return;
      }
      
      const fromDate = fromDateInput.value;
      const toDate = toDateInput.value;
      
      if (!fromDate || !toDate) {
        showMessage('❌ Please select both from and to dates', 'error');
        return;
      }
      
      if (new Date(fromDate) > new Date(toDate)) {
        showMessage('❌ From date cannot be after to date', 'error');
        return;
      }
      
      currentReportType = 'custom';
      const startDate = new Date(fromDate);
      startDate.setHours(0, 0, 0, 0);
      const endDate = new Date(toDate);
      endDate.setHours(23, 59, 59, 999);
      
      const periodLabel = 'Custom Range (' + startDate.toLocaleDateString('en-UG') + ' to ' + endDate.toLocaleDateString('en-UG') + ')';
      
      await fetchAndDisplayReport(startDate, endDate, periodLabel, 'custom');
    }

    // Download PDF report (simplified version)
    function downloadPDF() {
      if (!currentReportData || currentReportData.transactions.length === 0) {
        showMessage('❌ No report data available to download', 'error');
        return;
      }

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Report title
        doc.setFontSize(18);
        doc.setTextColor(67, 97, 238);
        doc.text('UGX Expenses Tracker - Report', 105, 20, { align: 'center' });
        
        // Report period
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(currentReportData.periodLabel, 105, 30, { align: 'center' });
        
        // Summary section
        doc.setFontSize(14);
        doc.setTextColor(67, 97, 238);
        doc.text('Summary', 20, 45);
        
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text(`Total Income: ${formatCurrency(currentReportData.totalIncome)}`, 25, 55);
        doc.text(`Total Expenses: ${formatCurrency(currentReportData.totalExpenses)}`, 25, 62);
        doc.text(`Net Balance: ${formatCurrency(currentReportData.totalIncome - currentReportData.totalExpenses)}`, 25, 69);
        doc.text(`Date Range: ${currentReportData.startDate.toLocaleDateString('en-UG')} to ${currentReportData.endDate.toLocaleDateString('en-UG')}`, 25, 76);
        
        // Save the PDF
        const fileName = `expenses_report_${currentReportData.type}_${new Date().toISOString().split('T')[0]}.pdf`;
        doc.save(fileName);
        
        showMessage('✅ PDF report downloaded successfully!', 'success');
        
      } catch (error) {
        console.error('Error generating PDF:', error);
        showMessage('❌ Error generating PDF: ' + error.message, 'error');
      }
    }

    // Auto-refresh dashboard every minute
    setInterval(() => {
      if (isFirestoreReady) {
        loadDashboard();
      }
    }, 60000);
  </script>
</body>
</html>
